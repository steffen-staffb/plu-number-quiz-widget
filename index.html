<!DOCTYPE html>
<html lang="en">
<head>
<!-- Staffbase brand color via ?brand= URL param (sb-brand-url-param) -->
<script>(function(){try{var b=new URLSearchParams(location.search).get('brand');if(b&&/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(b)){document.documentElement.style.setProperty('--sb-brand',b);}}catch(e){}})();</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="widget-name" content="Quarterly Performance">
<meta name="widget-description" content="Animated revenue bars for the last 5 quarters plus year-to-date">
<meta name="widget-tags" content="Reports & Dashboards, Finance">
<title>Quarterly Performance</title>

<style>
    :root {
        --primary: var(--sb-brand, #2563eb);
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        /* Explicit design request: fixed brand-red background with white
           bars/text, regardless of light/dark scheme. */
        --text: #ffffff;
        --text-light: rgba(255, 255, 255, 0.75);
        --bg: #E1000F;
        --bg-gray: #f9fafb;
        --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --primary: var(--sb-brand, #3b9eff);
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --text: #ffffff;
            --text-light: rgba(255, 255, 255, 0.75);
            --bg: #E1000F;
            --bg-gray: #111827;
            --border: #374151;
        }
    }

    * { box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
    }

    .widget {
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        background: var(--bg);
        border-radius: 14px;
        padding: 20px 20px 24px;
    }

    .widget h2 {
        margin: 0 0 20px 0;
        text-align: left;
        font-size: 22px;
        letter-spacing: -0.01em;
        color: var(--text);
    }

    .cw-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .cw-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .cw-row-label {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 13px;
        color: var(--text);
    }

    .cw-row-name {
        font-weight: 500;
        opacity: 0.9;
    }

    .cw-row-name.cw-row-name-ytd {
        font-weight: 700;
        opacity: 1;
    }

    .cw-row-value {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
    }

    .cw-track {
        position: relative;
        height: 22px;
        background: rgba(255, 255, 255, 0.18);
        overflow: hidden;
    }

    .cw-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0%;
        background: #ffffff;
        transition: width 1.1s cubic-bezier(0.22, 0.9, 0.32, 1);
    }

    .cw-fill.cw-fill-ytd {
        background: #ffffff;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
    }
</style>
</head>

<body>

<div class="widget">
    <h2 data-i18n="title"></h2>
    <div class="cw-list" id="cwList"></div>
</div>

<script>
    // --- Language detection (per widgets/MULTILANGUAGE.md) ---
    const LANG = (() => {
        const l = navigator.language || '';
        if (l.startsWith('de')) return 'de';
        if (l.startsWith('fr')) return 'fr';
        if (l.startsWith('es')) return 'es';
        if (l.startsWith('ja')) return 'ja';
        if (l === 'en-GB')      return 'en-GB';
        return 'en-US';
    })();
    document.documentElement.lang = LANG;

    const LOCALE = {
        'de': 'de-DE', 'fr': 'fr-FR', 'es': 'es-ES',
        'ja': 'ja-JP', 'en-GB': 'en-GB', 'en-US': 'en-US'
    }[LANG];
    const CURRENCY = {
        'de': 'EUR', 'fr': 'EUR', 'es': 'EUR',
        'ja': 'JPY', 'en-GB': 'GBP', 'en-US': 'USD'
    }[LANG];

    // --- Translations ---
    const T = {
        de: {
            title: 'Quartalsleistung',
            ytd: 'Laufendes Jahr (YTD)',
        },
        fr: {
            title: 'Performance trimestrielle',
            ytd: 'Cumul annuel (YTD)',
        },
        es: {
            title: 'Rendimiento trimestral',
            ytd: 'Acumulado anual (YTD)',
        },
        ja: {
            title: '四半期実績',
            ytd: '年初来累計 (YTD)',
        },
        'en-GB': {
            title: 'Quarterly Performance',
            ytd: 'Year to date (YTD)',
        },
        'en-US': {
            title: 'Quarterly Performance',
            ytd: 'Year to date (YTD)',
        },
    };
    const t = T[LANG] ?? T['en-US'];

    // --- Staffbase brand color passthrough ---
    function applySBBrand() {
        var sb = getComputedStyle(document.documentElement).getPropertyValue('--sb-brand').trim();
        if (sb) {
            document.documentElement.style.setProperty('--primary', sb);
            return;
        }
        try {
            sb = window.parent.getComputedStyle(window.parent.document.documentElement)
                    .getPropertyValue('--sb-brand').trim();
            if (sb) document.documentElement.style.setProperty('--primary', sb);
        } catch (e) { /* cross-origin, ignore */ }
    }

    // --- Date helpers (anchor mock data to now, per CLAUDE.md #6) ---
    const now = new Date();
    const currentYear = now.getFullYear();
    const currentQuarterIdx = Math.floor(now.getMonth() / 3); // 0-3

    // Mock revenue in $M for the 5 completed quarters shown, oldest -> newest.
    const QUARTER_REVENUE = [3.2, 3.6, 3.4, 4.1, 4.5];

    const quarters = [];
    for (let i = 5; i >= 1; i--) {
        let qIdx = currentQuarterIdx - i;
        let year = currentYear;
        while (qIdx < 0) { qIdx += 4; year -= 1; }
        quarters.push({ year: year, quarter: qIdx, revenue: QUARTER_REVENUE[5 - i] });
    }

    // Estimate the in-progress current quarter's contribution to YTD.
    const qStart = new Date(currentYear, currentQuarterIdx * 3, 1);
    const qEnd = new Date(currentYear, currentQuarterIdx * 3 + 3, 1);
    const daysInQuarter = (qEnd - qStart) / 86400000;
    const daysElapsed = Math.max(0, (now - qStart) / 86400000);
    const avgRevenue = QUARTER_REVENUE.reduce((a, b) => a + b, 0) / QUARTER_REVENUE.length;
    const partialQuarterRevenue = avgRevenue * (daysElapsed / daysInQuarter) * 1.05;

    const ytdRevenue = quarters
        .filter(q => q.year === currentYear)
        .reduce((sum, q) => sum + q.revenue, 0) + partialQuarterRevenue;

    function quarterLabel(qtr) {
        const q = qtr.quarter + 1;
        if (LANG === 'ja') return qtr.year + '年 第' + q + '四半期';
        const prefix = (LANG === 'fr' || LANG === 'es') ? 'T' : 'Q';
        return prefix + q + ' ' + qtr.year;
    }

    const moneyFmt = new Intl.NumberFormat(LOCALE, {
        style: 'currency',
        currency: CURRENCY,
        notation: 'compact',
        maximumFractionDigits: 1
    });
    function formatRevenue(millions) {
        return moneyFmt.format(millions * 1e6);
    }

    const rows = [
        { label: t.ytd, value: ytdRevenue, isYtd: true }
    ].concat(quarters.slice().reverse().map(q => ({
        label: quarterLabel(q), value: q.revenue, isYtd: false
    })));

    const maxValue = Math.max.apply(null, rows.map(r => r.value));

    function renderBars() {
        const list = document.getElementById('cwList');
        rows.forEach((row, i) => {
            const pct = (row.value / maxValue) * 100;
            const item = document.createElement('div');
            item.className = 'cw-row';
            item.innerHTML =
                '<div class="cw-row-label">' +
                    '<span class="cw-row-name' + (row.isYtd ? ' cw-row-name-ytd' : '') + '">' + row.label + '</span>' +
                    '<span class="cw-row-value">' + formatRevenue(row.value) + '</span>' +
                '</div>' +
                '<div class="cw-track">' +
                    '<div class="cw-fill' + (row.isYtd ? ' cw-fill-ytd' : '') + '" style="transition-delay:' + (i * 110) + 'ms"></div>' +
                '</div>';
            list.appendChild(item);
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    item.querySelector('.cw-fill').style.width = pct + '%';
                });
            });
        });
    }

    // --- Apply translations + render on DOM ready ---
    function init() {
        applySBBrand();
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.dataset.i18n;
            if (t[key] !== undefined) el.textContent = t[key];
        });
        renderBars();
    }

    document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
